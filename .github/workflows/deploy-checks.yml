name: deploy-checks

# Production checks (SPEC §6 Deploy ACs) from a GitHub-hosted runner, started by hand: Actions → deploy-checks →
# Run workflow. Same tests, thresholds and measurements as `npm run test:deploy` and `npm run probe:draw` on the
# developer machine; only where they run differs (SPEC v0.5, PLAN B1). No secrets: the checks use only public routes.
on:
  workflow_dispatch:
    inputs:
      DEPLOY_URL:
        description: Production URL to check
        default: https://playhuddle.vercel.app
        required: true
        type: string

permissions:
  contents: read

# One run at a time, so two runs never load production together. GitHub keeps only one run waiting: clicking Run
# workflow again while one runs and one waits replaces the waiting one (it shows as cancelled).
concurrency:
  group: deploy-checks
  cancel-in-progress: false

jobs:
  deploy-checks:
    runs-on: ubuntu-24.04
    # Setup (~1 min) + system packages (≤ 25 min, normally under 5) + browsers (≤ 17) + checks (~6 min) + probe (~2 min).
    timeout-minutes: 60
    env:
      DEPLOY_URL: ${{ inputs.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # As in ci.yml: apt retries downloads and waits for its lock instead of being cut off (see PLAN, 2026-10-27).
      - name: System packages for Chromium, Firefox and WebKit
        run: |
          printf 'Acquire::Retries "5";\nDPkg::Lock::Timeout "900";\n' | sudo tee /etc/apt/apt.conf.d/80-ci > /dev/null
          if npx playwright install-deps chromium firefox webkit > deps.log 2>&1; then cat deps.log; exit 0; fi
          cat deps.log
          echo "::error title=playwright install-deps failed::$(tail -n 8 deps.log | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-900)"
          exit 1
        timeout-minutes: 25
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-deploy-checks-${{ hashFiles('package-lock.json') }}
      - name: Browsers (5 min per attempt, up to 3 attempts)
        run: |
          for attempt in 1 2 3; do
            if timeout 5m npx playwright install chromium firefox webkit; then exit 0; fi
            echo "::warning::browser download attempt $attempt failed or stalled"
            [ "$attempt" = 3 ] || sleep 20
          done
          exit 1
        timeout-minutes: 17
      - name: npm run test:deploy against ${{ inputs.DEPLOY_URL }}
        id: deploy
        run: npm run test:deploy -- --reporter=list,github,html
        timeout-minutes: 20
      - name: npm run probe:draw against ${{ inputs.DEPLOY_URL }}
        id: probe
        if: always() && steps.deploy.outcome != 'skipped'
        run: npm run probe:draw
        timeout-minutes: 8
      # Every result the checks recorded becomes a public annotation (job logs and artifacts need sign-in).
      - name: Results as annotations
        if: always()
        run: git diff -U0 docs/deploy-checks.md | npx tsx scripts/deploy-annotations.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-checks-report
          path: |
            playwright-report
            test-results
            docs/deploy-checks.md
          if-no-files-found: warn
          retention-days: 14
