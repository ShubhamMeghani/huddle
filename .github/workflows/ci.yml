name: CI

on:
  push:
  pull_request:

env:
  CI: 'true'
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  # lint → typecheck → unit/content tests (Postgres service)
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Sentinel production build → E2E, one device project per job (2 workers each, see playwright.config.ts)
  e2e:
    runs-on: ubuntu-24.04
    # Setup (~1 min) + system packages (≤ 25 min, normally under 5) + browser (≤ 17, normally under 1) + E2E (killed
    # at 20 min, step limit 25).
    timeout-minutes: 70
    name: e2e (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: android, project: android, browser: chromium, shard: 1/1, workers: 2 }
          # WebKit stalled a whole runner with 2 workers: three shards, one worker each.
          - { label: iphone-1, project: iphone, browser: webkit, shard: 1/3, workers: 1 }
          - { label: iphone-2, project: iphone, browser: webkit, shard: 2/3, workers: 1 }
          - { label: iphone-3, project: iphone, browser: webkit, shard: 3/3, workers: 1 }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # System packages come from the runner's apt mirror, which is sometimes very slow (16-23 min against a usual
      # 0.5-5). apt retries each download and waits for the package lock instead of failing on it, and it is never cut
      # off: `timeout` cannot kill the root-owned apt-get, which then held the lock against every retry. A failure's
      # last lines become a public annotation (job logs need sign-in).
      - name: System packages for ${{ matrix.browser }}
        run: |
          printf 'Acquire::Retries "5";\nDPkg::Lock::Timeout "900";\n' | sudo tee /etc/apt/apt.conf.d/80-ci > /dev/null
          if npx playwright install-deps ${{ matrix.browser }} > deps.log 2>&1; then cat deps.log; exit 0; fi
          cat deps.log
          echo "::error title=playwright install-deps failed::$(tail -n 8 deps.log | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-900)"
          exit 1
        timeout-minutes: 25
      # The browser itself comes from Playwright's CDN, cached per browser and lockfile; a stuck download is retried.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - name: ${{ matrix.browser }} browser (5 min per attempt, up to 3 attempts)
        run: |
          for attempt in 1 2 3; do
            if timeout 5m npx playwright install ${{ matrix.browser }}; then exit 0; fi
            echo "::warning::browser download attempt $attempt failed or stalled"
            [ "$attempt" = 3 ] || sleep 20
          done
          exit 1
        timeout-minutes: 17
      - name: E2E (hard-killed after 20 min; memory and load logged every 60 s)
        run: |
          # Evidence if the runner stalls: printed live to the job log and kept for the artifact.
          (while true; do { echo "== $(date -u +%H:%M:%S) $(uptime)"; free -m; } | tee -a resources.log; sleep 60; done) &
          MONITOR=$!
          set +e
          timeout --signal=KILL 20m npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }} --workers=${{ matrix.workers }}
          code=$?
          if [ "$code" = 137 ]; then
            echo "::error::E2E was still running after 20 min and was killed"
            # timeout kills only npm: also kill what it started, so nothing holds the log open.
            pkill -KILL -f 'playwright|next start|MiniBrowser|WebKitWebProcess|WebKitNetworkProcess|e2e-server|postgres -D' || true
          fi
          kill "$MONITOR" 2>/dev/null
          exit "$code"
        # Backstop above the 20-minute kill; Playwright's own globalTimeout (25 min) is a further layer.
        timeout-minutes: 25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.label }}
          path: |
            playwright-report
            test-results
            resources.log
          if-no-files-found: warn
          retention-days: 7
